<header class="site-header">
  <div class="container">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.site.name }}</a>
    <nav aria-label="Main">
      <ul class="nav">
        {% for item in site.data.navigation.main %}
        {% assign section = item.url | split: "/" | slice: 1 | first %}
        {% assign here = page.url | split: "/" | slice: 1 | first %}
        <li><a href="{{ item.url | relative_url }}"{% if item.url == page.url or section and section == here %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
