<footer class="site-footer">
  <div class="container">
    <p>{{ site.data.site.name }}{% if site.data.site.email %} &middot; <a href="mailto:{{ site.data.site.email }}">{{ site.data.site.email }}</a>{% endif %}</p>
    <ul class="footer-links">
      {% for item in site.data.navigation.footer %}
      <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
</footer>
