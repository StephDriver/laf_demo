---
layout: default
---
{% include project-info.html doc=page %}
<nav class="breadcrumbs" aria-label="Breadcrumb"><a href="{{ '/projects/' | relative_url }}">Projects</a> <span aria-hidden="true">&rsaquo;</span> <a href="{{ project_url | relative_url }}">{{ project.title }}</a></nav>
<article class="prose">
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  {{ content }}
  <p><a href="{{ project_url | relative_url }}">More about {{ project.title }}</a></p>
</article>
