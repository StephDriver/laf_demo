<!DOCTYPE html>
<html lang="en-GB" data-baseurl="{{ site.baseurl }}">
{% include head.html %}
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% if site.data.site.demo %}
  <div class="demo-banner" role="note">
    <strong>Demo site.</strong> {{ site.data.site.demo_message }}
  </div>
  {% endif %}
  {% include header.html %}
  <main id="main" class="container" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
