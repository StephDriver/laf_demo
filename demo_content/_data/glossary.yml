# Glossary terms. Add a new entry anywhere in this file: the page sorts them
# A to Z for you. Each entry needs a term and a definition.
# Keep the indentation exactly as shown. Wrap a definition in quotes if it
# contains a colon.

- term: Bridleway
  definition: A public right of way on foot, on horseback or leading a horse, and by pedal cycle. Cyclists must give way to walkers and horse riders.

- term: Byway open to all traffic (BOAT)
  definition: A public right of way that all traffic, including motor vehicles, may use. It is mainly used as a footpath or bridleway.

- term: Countryside and Rights of Way Act 2000 (CROW Act)
  definition: The law that created the right to walk on open access land, required highway authorities to improve rights of way, and set up Local Access Forums.

- term: Definitive Map and Statement
  definition: The legal record of public rights of way, kept by the highway authority. If a path is on the Definitive Map, the right exists. If it is not, it may still exist but would need to be proved.

- term: Footpath
  definition: A public right of way on foot only.

- term: Highway authority
  definition: The council responsible for looking after public rights of way and keeping the Definitive Map. In a two-tier area this is the county council.

- term: Local Access Forum (LAF)
  definition: An independent group of volunteers that advises councils and other bodies on improving public access to land for open-air recreation and enjoyment.

- term: Least restrictive access
  definition: The principle that a path barrier should be as easy to use as possible. For example, replacing a stile with a gate, or a gate with a gap, where the landowner agrees.

- term: Open access land
  definition: Mapped areas of mountain, moor, heath, down and registered common land where the public has a right to walk without staying on a path.

- term: Path furniture
  definition: Stiles, gates, bridges, waymarks and signs on a path.

- term: Permissive path
  definition: A path the landowner allows the public to use. It is not a public right of way, so the landowner can close or change it.

- term: Public right of way
  definition: A path that anyone may use at any time. The main types are footpaths, bridleways, restricted byways and byways open to all traffic.

- term: Restricted byway
  definition: A public right of way on foot, on horseback, by pedal cycle and by horse-drawn vehicle. Motor vehicles are not allowed.

- term: Rights of Way Improvement Plan (ROWIP)
  definition: A plan each highway authority must prepare, setting out how it will improve its rights of way network for all users. Local Access Forums are consulted on it.

- term: Waymark
  definition: A coloured arrow on a post, gate or stile showing the direction and type of a public right of way. Yellow is for footpaths, blue for bridleways, plum for restricted byways and red for byways open to all traffic.
